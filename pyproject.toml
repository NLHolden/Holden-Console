[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holden-console"
version = "0.1.0"
description = "Private broadcast control system for the NLHolden stream."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "obsws-python>=1.7",
    "mypy>=1.18.2",
    "spotipy>=2.26.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
holden-console = "interface.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
